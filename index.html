<style>
:root{--bg1:#0a1631;--bg2:#1c2f58;--pn:#132445;--pn2:#1c2c52;--gold:#d9b25a;--tx:#f2eee3;--mu:#a7b2c7;--ok:#5cc48a;--bad:#e0625f;--bl:#6fa8dc;--ln:#2f4066;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.mu{color:var(--mu)}

.dots{display:flex;flex-wrap:wrap;gap:6px}.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);cursor:pointer;font:inherit}.dot.d{background:#2a2a1c;border-color:var(--gold)}.dot.c{outline:2px solid var(--gold)}

.hero{text-align:center;padding:36px 8px 20px}.hero h1{font-size:clamp(1.8rem,7vw,3.2rem);margin:.3em 0}

<script>
/* ============ CONTENT DATA (كل المحتوى العلمي من ملف الدرس) ============ */
const G=6.67e-11;
const fr=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const L=s=>`<bdi dir="ltr" class="m">${s}</bdi>`;
const LAW=`<span class="m">F = G × ${fr('m₁ × m₂','r²')}</span>`;
const TOPICS={c:'مفهوم الجذب العام',law:'نص القانون ورموزه',G:'ثابت الجذب العام G ووحدته',calc:'الحسابات المباشرة',ratio:'النسب والتناسب',third:'قانون نيوتن الثالث',res:'القوة المحصلة'};
const QA={
concept:[['ما المقصود بقوة الجذب العام؟','هي قوة التجاذب المتبادلة بين أي جسمين لهما كتلة.'],['على ماذا تعتمد قوة الجذب العام بين جسمين؟','تعتمد على كتلتي الجسمين والمسافة بين مركزيهما.'],['ماذا يحدث لقوة الجذب إذا زادت كتلة أحد الجسمين؟','تزداد قوة الجذب.'],['ماذا يحدث لقوة الجذب إذا زادت المسافة بين الجسمين؟','تقل قوة الجذب.'],['هل قوة الجذب العام قوة تجاذب أم تنافر؟','قوة تجاذب.']],
law:[['اكتب نص قانون نيوتن للجذب العام.','تتجاذب كل كتلتين في الكون بقوة تتناسب طرديًا مع حاصل ضرب كتلتيهما، وعكسيًا مع مربع المسافة بين مركزيهما.'],['اكتب العلاقة الرياضية لقانون الجذب العام.',L('F = G × (m₁ × m₂) / r²')],['ماذا تمثل F؟','قوة الجذب المتبادلة بين الجسمين، وتقاس بالنيوتن.'],['ماذا تمثل r؟','المسافة بين مركزي الجسمين.'],['لماذا توجد r² في المقام؟','لأن قوة الجذب تتناسب عكسيًا مع مربع المسافة.']],
g:[['ما قيمة ثابت الجذب العام G؟',L('6.67 × 10⁻¹¹ N·m²/kg²')],['هل تتغير قيمة G من مسألة إلى أخرى؟','لا، قيمة G ثابتة.'],['ما وحدة قياس G؟',L('N·m²/kg²')],['ماذا يعني أن قيمة G صغيرة جدًا؟','يعني أن قوة الجذب العام تكون ضعيفة نسبيًا بين الأجسام ذات الكتل العادية.']],
res:[['قوتا جذب مقدارهما 15 N و10 N وفي نفس الاتجاه. احسب المحصلة.','25 N في اتجاه القوتين.'],['قوتا جذب 25 N إلى اليمين و15 N إلى اليسار. احسب المحصلة.','10 N إلى اليمين.'],['قوتان متساويتان ومتضادتان، كل منهما 20 N. ما المحصلة؟','صفر نيوتن.'],['قوى مقدارها 30 N يمينًا، و10 N يسارًا، و5 N يسارًا. ما المحصلة؟','30 − (10 + 5) = 15 N إلى اليمين.']],
third:[['هل قوة الأرض المؤثرة في جسم تساوي قوة الجسم المؤثرة في الأرض؟','نعم، القوتان متساويتان في المقدار ومتضادتان في الاتجاه.'],['لماذا لا تلغي القوتان بعضهما؟','لأن كل قوة تؤثر في جسم مختلف.'],['الأرض تجذب جسمًا بقوة 100 N. ما مقدار قوة جذب الجسم للأرض؟','100 N في الاتجاه المعاكس.'],['ما القانون الذي يفسر تساوي قوتي التجاذب؟','قانون نيوتن الثالث للحركة.'],['هل اختلاف كتلتي الأرض والجسم يجعل قوتي التجاذب مختلفتين؟','لا؛ القوتان متساويتان في المقدار. الاختلاف يظهر في العجلة لأن الكتلتين مختلفتان.']]
};
const CALC=[['كتلتان 5 kg و10 kg، والمسافة بين مركزيهما 2 m. احسب قوة الجذب.','F = 6.67×10⁻¹¹ × (5×10) / 4','8.3375×10⁻¹⁰ N'],['كتلة جسم 10 kg وكتلة جسم آخر 30 kg، والمسافة بين مركزيهما 3 m. احسب قوة الجذب.','F = 6.67×10⁻¹¹ × (10×30) / 9','2.223×10⁻⁹ N'],['كتلتان 4 kg و6 kg والمسافة بين مركزيهما 2 m. احسب قوة الجذب.','F = 6.67×10⁻¹¹ × (4×6) / 4','4.002×10⁻¹⁰ N'],['كتلتان 20 kg و30 kg والمسافة بين مركزيهما 5 m. احسب قوة الجذب.','F = 6.67×10⁻¹¹ × (20×30) / 25','1.6008×10⁻⁹ N'],['إذا كانت قوة الجذب بين جسمين 8×10⁻⁹ N، ثم زادت المسافة إلى الضعف، فما القوة الجديدة؟','القوة الجديدة = 8×10⁻⁹ / 4','2×10⁻⁹ N']];
const RATIO=[
{h:'أولًا: تغير كتلة واحدة',p:'إذا تضاعفت كتلة أحد الجسمين مع ثبات باقي العوامل، تتضاعف القوة.',qa:[['إذا تضاعفت كتلة أحد الجسمين، ماذا يحدث لقوة الجذب؟','تتضاعف قوة الجذب.'],['إذا أصبحت كتلة أحد الجسمين ثلاثة أمثالها، ماذا يحدث للقوة؟','تصبح القوة ثلاثة أمثالها.']]},
{h:'ثانيًا: تغير الكتلتين',p:'إذا تضاعفت كتلة كل من الجسمين: '+L("F′ = 2 × 2 F = 4F"),qa:[['إذا تضاعفت كتلة كل من الجسمين، فماذا يحدث للقوة؟','تصبح أربعة أمثالها: '+L('F′ = 2×2F = 4F')],['إذا أصبحت كتلة الجسم الأول 3 أمثالها والثاني ضعفيه، فما نسبة القوة الجديدة إلى الأصلية؟',L('F′/F = 3×2 = 6')+' ؛ أي تصبح القوة ستة أمثالها.']]},
{h:'ثالثًا: تغير المسافة',p:'إذا تضاعفت المسافة: '+L('F′ = F / 4')+' — إذا أصبحت المسافة نصف قيمتها: '+L('F′ = 4F')+' — إذا أصبحت ثلاثة أمثالها: '+L('F′ = F / 9'),qa:[['إذا تضاعفت المسافة بين الجسمين، فماذا يحدث للقوة؟','تصبح ربع قيمتها.'],['إذا أصبحت المسافة نصف قيمتها، فماذا يحدث للقوة؟','تصبح أربعة أمثال قيمتها.'],['إذا أصبحت المسافة ثلاثة أمثالها، فما القوة الجديدة بالنسبة للأصلية؟','تصبح 1/9 من القيمة الأصلية.']]},
{h:'رابعًا: مسائل نسب مركبة',p:'الخطوات: المعطيات ← العلاقة ← التعويض النسبي ← النتيجة.',qa:[['زادت كتلة الجسم الأول إلى ثلاثة أمثالها، والثاني إلى ضعفيها، وأصبحت المسافة ضعف قيمتها. كم تصبح القوة؟',L('F′/F = (3×2)/(2²) = 6/4 = 3/2')+' ؛ أي تصبح 1.5 مرة من قيمتها الأصلية.'],['تضاعفت كتلة الجسم الأول، وثبتت كتلة الجسم الثاني، وأصبحت المسافة نصف قيمتها. كم تصبح القوة؟',L('F′/F = 2/(1/2)² = 2/(1/4) = 8')+' ؛ أي تصبح ثمانية أمثالها.'],['قلت كتلة أحد الجسمين إلى النصف، وتضاعفت المسافة. كم تصبح القوة؟',L('F′/F = (1/2)/4 = 1/8')+' ؛ أي تصبح ثُمن قيمتها الأصلية.']]}];
const APPLY=[['اكتب القانون.',L('F = G(m₁m₂)/r²')],['احسب قوة الجذب.',L('F = 3.335×10⁻⁹ N')],['إذا تضاعفت المسافة فما القوة؟','عند مضاعفة المسافة تصبح القوة ربع القيمة = '+L('8.3375×10⁻¹⁰ N')],['إذا تضاعفت كتلة الجسم الأول فما القوة؟','تصبح القوة ضعف القيمة = '+L('6.67×10⁻⁹ N')],['هل القوتان المتبادلتان متساويتان؟','نعم، القوتان متساويتان في المقدار ومتضادتان في الاتجاه، وفقًا لقانون نيوتن الثالث.']];
/* بنك الأسئلة: a = رقم الإجابة الصحيحة. مصدره القسم التاسع والأقسام السابقة من الملف */
const BANK=[
{t:'c',q:'قوة الجذب العام تعتمد على:',o:['الكتلتين فقط','المسافة فقط','الكتلتين والمسافة','حجم الجسمين فقط'],a:2,e:'تعتمد على كتلتي الجسمين والمسافة بين مركزيهما.'},
{t:'law',q:'العلاقة الصحيحة لقوة الجذب العام هي:',o:['F=Gm₁m₂r²','F=Gm₁m₂/r²','F=Gr²/m₁m₂','F=Gr/m₁m₂'],a:1,e:'F = G(m₁m₂)/r²'},
{t:'ratio',q:'إذا تضاعفت المسافة بين جسمين، فإن قوة الجذب:',o:['تتضاعف','تصبح نصفًا','تصبح ربعًا','تصبح أربعة أمثال'],a:2,e:'F ∝ 1/r²، فعند مضاعفة المسافة تصبح القوة ربع قيمتها.'},
{t:'ratio',q:'إذا تضاعفت كتلة أحد الجسمين، فإن قوة الجذب:',o:['تقل للنصف','تتضاعف','تصبح أربعة أمثال','لا تتغير'],a:1,e:'F ∝ m₁ (أو m₂)، فتتضاعف القوة.'},
{t:'G',q:'قيمة G تقريبًا:',o:['9.8','3×10⁸','6.67×10⁻¹¹','1.6×10⁻¹⁹'],a:2,e:'G = 6.67×10⁻¹¹ N·m²/kg².'},
{t:'third',q:'إذا جذبت الأرض جسمًا بقوة 50 N، فإن الجسم يجذب الأرض:',o:['25 N','صفر','أكثر من 50 N','50 N في الاتجاه المعاكس'],a:3,e:'القوتان متساويتان في المقدار ومتضادتان في الاتجاه (قانون نيوتن الثالث).'},
{t:'res',q:'قوتان متساويتان ومتضادتان تؤثران في جسم، محصلتهما:',o:['مجموعهما','ضعف إحداهما','القوة الأكبر','صفر'],a:3,e:'مقدار المحصلة = القوة الأكبر − القوة الأصغر = صفر.'},
{t:'third',q:'لماذا لا تلغي القوتان المتبادلتان بعضهما؟',o:['لأن إحداهما أكبر من الأخرى','لأن كل قوة تؤثر في جسم مختلف','لأن القوتين في الاتجاه نفسه','لأن كتلتي الجسمين متساويتان'],a:1,e:'كل قوة تؤثر في جسم مختلف.'},
{t:'law',q:'ماذا تمثل r في القانون؟',o:['كتلة الجسم الأول','ثابت الجذب العام','المسافة بين مركزي الجسمين','قوة الجذب'],a:2,e:'r هي المسافة بين مركزي الجسمين.'},
{t:'G',q:'ما وحدة قياس الثابت G؟',o:['N·m²/kg²','N/kg','kg·m/s²','N·m/kg'],a:0,e:'وحدة G هي N·m²/kg².'},
{t:'calc',q:'كتلتان 5 kg و10 kg والمسافة بين مركزيهما 2 m. قوة الجذب بينهما:',o:['3.335×10⁻⁹ N','8.3375×10⁻¹⁰ N','1.6675×10⁻⁹ N','2.223×10⁻⁹ N'],a:1,e:'F = 6.67×10⁻¹¹ × (5×10)/4 = 8.3375×10⁻¹⁰ N.'},
{t:'calc',q:'كتلتان 4 kg و6 kg والمسافة بين مركزيهما 2 m. قوة الجذب بينهما:',o:['8.004×10⁻¹⁰ N','1.6008×10⁻⁹ N','2.223×10⁻⁹ N','4.002×10⁻¹⁰ N'],a:3,e:'F = 6.67×10⁻¹¹ × (4×6)/4 = 4.002×10⁻¹⁰ N.'},

let act=store.get('gr_active'),timer=null,lastRes=null;
const DUR=60*60*1000;
function quizIntro(){return `${hd('اختبار قانون نيوتن للجذب العام','Final Quiz')}<div class="card"><p>15 سؤالًا اختيار من متعدد · الزمن 60 دقيقة · يبدأ العد التنازلي بمجرد الضغط على «بدء الاختبار».</p>${lastRes?`<p class="okc">تم إرسال اختبارك. <button class="btn sm" data-go="_res">عرض النتيجة</button></p>`:''}<label for="nm">الاسم الثلاثي (إجباري)</label><input id="nm" autocomplete="name"><label for="em">البريد الإلكتروني (إجباري)</label><input id="em" type="email" dir="ltr" autocomplete="email"><p class="err" id="er"></p><div class="row"><button class="btn gold" id="go">بدء الاختبار</button></div></div>`}
function startQuiz(){const n=$('#nm').value.trim().replace(/\s+/g,' '),e=$('#em').value.trim().toLowerCase(),er=$('#er');
 if(n.split(' ').length<3)return er.textContent='أدخل الاسم الثلاثي (ثلاث كلمات).';
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return er.textContent='أدخل بريدًا إلكترونيًا صحيحًا.';
 if(DS.has(e))return er.textContent='تم إرسال اختبار بهذا البريد من قبل، ولا يمكن إرساله مرة أخرى.';
 act={name:n,email:e,start:Date.now(),ans:{},i:0};store.set('gr_active',act);show('quiz');tick()}
function quizQ(){const q=BANK[act.i],n=Object.keys(act.ans).length;
 return `<div class="card"><p class="mu">السؤال ${act.i+1} من ${BANK.length} · تمت الإجابة عن ${n}</p><h3><bdi>${q.q}</bdi></h3><div id="ops">${q.o.map((o,j)=>`<button class="opt${act.ans[act.i]===j?' sel':''}" data-o="${j}"><bdi>${o}</bdi></button>`).join('')}</div>
<div class="row"><button class="btn" data-qn="-1" ${act.i?'':'disabled'}>السابق</button><button class="btn" data-qn="1" ${act.i<BANK.length-1?'':'disabled'}>التالي</button><button class="btn gold" id="fin">إنهاء وإرسال</button><span id="fm" class="err"></span></div>
<div class="dots">${BANK.map((_,k)=>`<button class="dot${act.ans[k]!=null?' d':''}${k==act.i?' c':''}" data-qg="${k}" aria-label="سؤال ${k+1}">${k+1}</button>`).join('')}</div></div>`}
function bindQ(){$('#tm').hidden=false;tick()}
function tick(){clearInterval(timer);if(!act)return;const t=$('#tm');t.hidden=false;
 const f=()=>{const rem=act.start+DUR-Date.now();if(rem<=0){t.textContent='00:00';submitQuiz(true);return}const s=Math.ceil(rem/1000);t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');t.className=s<300?'':'ok';};f();timer=setInterval(f,500)}
function analyze(ans){const o={};BANK.forEach((q,i)=>{(o[q.t]=o[q.t]||{n:0,c:0}).n++;if(ans[i]===q.a)o[q.t].c++});const s=[],r=[];Object.keys(o).forEach(t=>{(o[t].c/o[t].n>=.75?s:r).push(TOPICS[t])});return{s,r}}
function submitQuiz(auto){if(!act)return;clearInterval(timer);const end=Date.now(),ans=BANK.map((_,i)=>act.ans[i]??null),ok=ans.filter((a,i)=>a===BANK[i].a).length,an=analyze(ans);
 lastRes={name:act.name,email:act.email,score:ok,total:BANK.length,pct:Math.round(ok/BANK.length*100),ok,bad:BANK.length-ok,start:act.start,end:Math.min(end,act.start+DUR),ans,strengths:an.s,review:an.r,auto:!!auto};
 DS.save(lastRes);act=null;store.del('gr_active');$('#tm').hidden=true;$('#main').innerHTML=resView(lastRes)}
function resView(r,t){const rows=BANK.map((q,i)=>{const a=r.ans[i],good=a===q.a;return `<tr><td>${i+1}</td><td><bdi>${q.q}</bdi></td><td class="${good?'okc':'err'}"><bdi>${a==null?'لم يُجب':q.o[a]}</bdi></td><td><bdi>${q.o[q.a]}</bdi></td><td>${good?'✓':'✗'}</td></tr>`}).join('');
 return `${hd('نتيجة الاختبار','Quiz Result')}${r.auto?'<p class="err">انتهى الوقت، وتم إرسال إجاباتك تلقائيًا.</p>':''}<div class="card"><div class="stats"><div><b>${r.ok} / ${r.total}</b>الدرجة</div><div><b>${r.pct}%</b>النسبة</div><div><b>${r.ok}</b>صحيحة</div><div><b>${r.bad}</b>خاطئة</div></div><p>الطالب: <b>${r.name}</b> · <span dir="ltr">${r.email}</span><br>التاريخ: ${fmtD(r.start)} · البداية: ${fmtT(r.start)} · النهاية: ${fmtT(r.end)}</p></div>
<div class="card"><h3>تحليل الأداء</h3><p class="okc"><b>نقاط القوة:</b> ${r.strengths.length?r.strengths.join('، '):'لا توجد بعد'}</p><p class="err"><b>نقاط تحتاج إلى مراجعة:</b> ${r.review.length?r.review.join('، '):'لا توجد — أداء ممتاز'}</p></div>
<div class="card tw"><table><tr><th>#</th><th>السؤال</th><th>إجابة الطالب</th><th>الإجابة الصحيحة</th><th></th></tr>${rows}</table></div>`}

/* ============ TEACHER DASHBOARD & EXPORT ============ */
function dash(){const a=DS.all(),n=a.length,avg=n?(a.reduce((s,r)=>s+r.score,0)/n).toFixed(1):0,mx=n?Math.max(...a.map(r=>r.score)):0,mn=n?Math.min(...a.map(r=>r.score)):0,pass=n?Math.round(a.filter(r=>r.pct>=50).length/n*100):0,need=a.filter(r=>r.review.length).length;
 return `${hd('لوحة المعلم','Teacher Dashboard')}<div class="card err" style="color:var(--gold)">تُحفظ النتائج حاليًا في متصفح هذا الجهاز فقط (طبقة DataService جاهزة للربط بقاعدة بيانات).</div><div class="stats"><div><b>${n}</b>عدد الطلاب</div><div><b>${avg}</b>متوسط الدرجات</div><div><b>${mx}</b>أعلى درجة</div><div><b>${mn}</b>أقل درجة</div><div><b>${pass}%</b>نسبة النجاح (≥50%)</div><div><b>${need}</b>يحتاجون مراجعة</div></div>
<div class="row"><button class="btn gold" id="xl">تصدير النتائج إلى Excel</button><span id="xm" class="mu"></span></div>
<div class="card tw">${n?`<table><tr><th>الطالب</th><th>البريد الإلكتروني</th><th>الدرجة</th><th>النسبة</th><th>الصحيح</th><th>الخطأ</th><th>بداية الاختبار</th><th>نهاية الاختبار</th><th>التاريخ</th></tr>${a.map((r,i)=>`<tr><td><button class="btn sm" data-st="${i}">${r.name}</button></td><td dir="ltr">${r.email}</td><td>${r.score}/${r.total}</td><td>${r.pct}%</td><td>${r.ok}</td><td>${r.bad}</td><td>${fmtT(r.start)}</td><td>${fmtT(r.end)}</td><td>${fmtD(r.start)}</td></tr>`).join('')}</table>`:'<p class="mu">لا توجد نتائج بعد. ستظهر هنا نتائج الطلاب بعد إرسال اختباراتهم.</p>'}</div>`}
async function exportXl(){const m=$('#xm'),a=DS.all();if(!a.length)return m.textContent='لا توجد نتائج للتصدير.';if(!window.XLSX)return m.textContent='تعذر تحميل مكتبة Excel.';
 const rows=a.map(r=>({'اسم الطالب':r.name,'البريد الإلكتروني':r.email,'الدرجة':r.score+'/'+r.total,'النسبة المئوية':r.pct+'%','عدد الإجابات الصحيحة':r.ok,'عدد الإجابات الخاطئة':r.bad,'وقت بداية الاختبار':fmtT(r.start),'وقت نهاية الاختبار':fmtT(r.end),'التاريخ':fmtD(r.start),'نقاط القوة':r.strengths.join('، '),'نقاط تحتاج إلى مراجعة':r.review.join('، ')}));
 const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=Object.keys(rows[0]).map(()=>({wch:24}));const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,'النتائج');
 const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
 try{const d=await claude.use('downloads');if(!d)return m.textContent='الحفظ غير متاح في هذا العرض. افتح الرابط في claude.ai للتصدير.';await d.save({filename:'نتائج-قانون-الجذب-العام.xlsx',data:new Blob([buf])});m.textContent=''}catch(e){m.textContent=e&&e.code=='declined'?'تم إلغاء الحفظ.':'تعذر حفظ الملف.'}}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.id=='menu')return $('#nav').classList.toggle('open');
 if(t.dataset.go){if(t.dataset.go=='_res'){$('#main').innerHTML=resView(lastRes);return}return show(t.dataset.go)}
 if(t.classList.contains('rv')){const n=t.nextElementSibling;n.hidden=!n.hidden;t.textContent=n.hidden?(t.textContent.includes('الحل')?'إظهار الحل':'إظهار الإجابة'):(t.textContent.includes('الحل')?'إخفاء الحل':'إخفاء الإجابة');return}
 if(t.id=='nx'){const s=$('.stp[hidden]');if(s){s.hidden=false}if(!$('.stp[hidden]'))t.hidden=true;return}
 if(t.dataset.k){const p=t.closest('.pr'),k=t.dataset.k;if(k=='h')p.querySelectorAll('.s1,.s2,.s3').forEach(x=>x.hidden=true);else p.querySelector('.'+k).hidden=false;return}
 if(t.classList.contains('chk')){const c=t.closest('.pq'),q=BANK[+c.dataset.i],s=c.querySelector('input:checked'),f=c.querySelector('.fb');if(!s){f.innerHTML='<p class="err">اختر إجابة أولًا.</p>';return}const g=+s.value==q.a;f.innerHTML=`<p class="${g?'okc':'err'}"><b>${g?'✓ إجابة صحيحة':'✗ إجابة غير صحيحة'}</b></p><div class="a"><b>الإجابة الصحيحة:</b> <bdi>${q.o[q.a]}</bdi><br>${q.e}</div>`;return}
 if(t.dataset.o!=null&&act){act.ans[act.i]=+t.dataset.o;store.set('gr_active',act);$('#main').innerHTML=quizQ();return}
 if(t.dataset.qn&&act){act.i+=+t.dataset.qn;store.set('gr_active',act);$('#main').innerHTML=quizQ();return}
 if(t.dataset.qg&&act){act.i=+t.dataset.qg;store.set('gr_active',act);$('#main').innerHTML=quizQ();return}
 if(t.id=='go')return startQuiz();
 if(t.id=='fin'&&act){const left=BANK.length-Object.keys(act.ans).length;if(t.dataset.c){submitQuiz(false);return}t.dataset.c=1;t.textContent='تأكيد الإرسال';$('#fm').textContent=left?`متبقٍ ${left} سؤال بلا إجابة. اضغط مرة أخرى للتأكيد.`:'اضغط مرة أخرى لتأكيد الإرسال.';return}
 if(t.id=='xl')return exportXl();
 if(t.dataset.st!=null){const r=DS.all()[+t.dataset.st],m=$('#modal');m.innerHTML=`<div>${resView(r)}<button class="btn gold" id="cl">إغلاق</button></div>`;m.hidden=false;return}
 if(t.id=='cl')$('#modal').hidden=true});

/* ============ START ============ */
const start=(location.hash||'').slice(1);
show(act?'quiz':(V[start]?start:'home'));
if(act)tick();
</script>
</body>
</html>
